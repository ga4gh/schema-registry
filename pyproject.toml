[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "schema-registry-compliance"
version = "0.1.0"
description = "GA4GH Schema Registry compliance test suite"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
compliance = [
    "requests>=2.28",
    "rich>=13.0",
]
dev = [
    "requests>=2.28",
    "rich>=13.0",
    "pytest>=7.0",
]

[project.scripts]
compliance = "compliance.cli:main"

[tool.setuptools.packages.find]
include = ["compliance*"]
